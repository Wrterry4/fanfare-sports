# Build and deploy the PWA on every push to main.
#
# ── Why this exists ───────────────────────────────────────────────────────────
#
# Deploying used to mean being at the Windows machine: it holds the .env, the
# Firebase login, and node_modules. That made phone work read-only in practice —
# you could edit and push, but not ship.
#
# It also removes a footgun. Deploying by hand meant building, then committing,
# then noticing the build stamp named the PREVIOUS commit, then rebuilding. CI
# always builds from exactly what is on main, so the stamp cannot lie.
#
# ── What it will not do ───────────────────────────────────────────────────────
#
# Hosting only. Cloud Functions, Firestore rules and indexes stay manual, on
# purpose: a bad rules deploy can lock real families out of their own data, and
# that should be a decision someone makes at a keyboard, not a side effect of a
# push from a phone.

name: Deploy

on:
  push:
    branches: [main]
  # Lets you re-run a deploy from the Actions tab without an empty commit.
  workflow_dispatch:

# A second push while one is deploying cancels the first. The newer commit is
# the one that should win, and two concurrent hosting releases race.
concurrency:
  group: deploy-hosting
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install
        run: npm ci

      # The .env is gitignored — correctly, since it is per-machine — so CI
      # rebuilds it from repository secrets. Every EXPO_PUBLIC_* value ends up
      # in the shipped bundle and is public by design; they live in secrets to
      # keep them out of the repo, not because they are credentials.
      - name: Write .env
        run: |
          cat > .env <<'ENVEOF'
          EXPO_PUBLIC_FIREBASE_API_KEY=${{ secrets.EXPO_PUBLIC_FIREBASE_API_KEY }}
          EXPO_PUBLIC_FIREBASE_AUTH_DOMAIN=${{ secrets.EXPO_PUBLIC_FIREBASE_AUTH_DOMAIN }}
          EXPO_PUBLIC_FIREBASE_PROJECT_ID=${{ secrets.EXPO_PUBLIC_FIREBASE_PROJECT_ID }}
          EXPO_PUBLIC_FIREBASE_STORAGE_BUCKET=${{ secrets.EXPO_PUBLIC_FIREBASE_STORAGE_BUCKET }}
          EXPO_PUBLIC_FIREBASE_SENDER_ID=${{ secrets.EXPO_PUBLIC_FIREBASE_SENDER_ID }}
          EXPO_PUBLIC_FIREBASE_APP_ID=${{ secrets.EXPO_PUBLIC_FIREBASE_APP_ID }}
          EXPO_PUBLIC_FIREBASE_VAPID_KEY=${{ secrets.EXPO_PUBLIC_FIREBASE_VAPID_KEY }}
          EXPO_PUBLIC_SPARK_MODE=false
          ENVEOF

      # The gate. A push that breaks the engine must not reach anyone's phone,
      # and these run in seconds because nothing here touches Firebase.
      - name: Static checks
        run: npm run check

      - name: Tests
        run: npm test

      - name: Build
        run: npm run build:web

      # Fails loudly rather than deploying an app that cannot reach Firebase —
      # a missing secret otherwise produces a bundle that looks fine and is
      # completely inert, which is a miserable thing to debug from a phone.
      - name: Verify the build carries its config
        run: |
          set -e
          BUNDLE=$(find dist/_expo/static/js/web -name 'AppEntry-*.js' | head -1)
          test -n "$BUNDLE" || { echo "No bundle produced"; exit 1; }

          # The project id is inlined into the bundle at build time. If a secret
          # is missing it simply is not there, and the app looks fine while
          # being completely unable to reach Firebase.
          PROJECT_ID=$(grep '^EXPO_PUBLIC_FIREBASE_PROJECT_ID=' .env | cut -d= -f2-)
          test -n "$PROJECT_ID" || { echo "EXPO_PUBLIC_FIREBASE_PROJECT_ID secret is empty"; exit 1; }
          grep -q "$PROJECT_ID" "$BUNDLE" \
            || { echo "Bundle carries no Firebase project id — a secret is missing"; exit 1; }

          test -f dist/fonts/Archivo.woff2 || { echo "Fonts missing from dist/"; exit 1; }
          test -f dist/index.html || { echo "No index.html"; exit 1; }
          grep -q 'fonts.css' dist/index.html || { echo "finalize-web did not run"; exit 1; }

          echo "Bundle:   $BUNDLE"
          echo "Project:  $PROJECT_ID"

      - name: Authenticate to Firebase
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          test -n "$SA" || { echo "FIREBASE_SERVICE_ACCOUNT secret is not set"; exit 1; }
          printf '%s' "$SA" > "$RUNNER_TEMP/sa.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/sa.json" >> "$GITHUB_ENV"

      - name: Deploy hosting
        run: npx firebase deploy --only hosting --project fanfare-sports --non-interactive

      - name: Report the build stamp
        run: |
          echo "### Deployed" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          node -e "import('./src/generated/buildInfo.js').then(async (m) => {
            const { formatBuildLabel } = await import('./src/shared/buildLabel.js');
            console.log(formatBuildLabel(m.BUILD_INFO));
          })" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "https://fanfare-sports.web.app" >> "$GITHUB_STEP_SUMMARY"
